<html lang="en">
<head>

    <title>Lupa Password</title>
</head>
<body>

        <div class="bg1"></div>

            </div>

            <input id="Email" class="card-input" placeholder="Email Anda"/>
            <button type="button" class="btn-kirim">Kirim</button>
            <p class="p-halaman"><i class="fa-solid fa-arrow-left"></i><a href="Login.html">kembali ke halaman login</a></p>
        </div>
    </div>
