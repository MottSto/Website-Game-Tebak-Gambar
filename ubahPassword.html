<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Password</title>

    <link rel="stylesheet" href="ubahPassword.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="Javascript/UbahPassword.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="bg1"></div>

        <div class="form-box">
            <h1><i class="fa-solid fa-lock"></i> Ubah Kata Sandi</h1>

            <form id="ubahPasswordForm">
                <input type="password" id="passwordBaru" placeholder="Password Baru" required>
                <input type="password" id="konfirmasiPassword" placeholder="Konfirmasi Password" required>

                <button type="submit">Simpan</button>
            </form>

            <p><a href="Login.html"><i class="fa-solid fa-arrow-left"></i>Kembali ke Login</a></p>
        </div>
    </div>
</body>
</html>
